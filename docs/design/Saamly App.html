document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

6,49,46,.75)\">\n<li>Household of four in Linden, Joburg — Thandi, Marco, Ayanda (9) and Lulu (6).<\u002Fli>\n<li>Money stays out of these three flows. Prices only appear once you reach the basket.<\u002Fli>\n<li>Confidence is a first-class UI object: <em>Have<\u002Fem>, <em>Probably<\u002Fem>, <em>Use first<\u002Fem>, <em>Personal<\u002Fem>.<\u002Fli>\n<li>AI is never named in the interface. It plans, notices and compares silently.<\u002Fli>\n<li>Camera views are placeholders — drop real photos in later.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n\n<div style=\"background:#FFF8EC;border:1px solid rgba(36,49,46,.1);border-radius:18px;padding:18px 20px\">\n<div style=\"font:700 12px/1 Figtree;letter-spacing:.08em;text-transform:uppercase;color:#145C52;margin-bottom:12px\">The system<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:11px;font:400 13px/1.5 Figtree;color:rgba(36,49,46,.75)\">\n<div><strong style=\"color:#24312E\">Surfaces.<\u002Fstrong> Warm cream page, white cards, deep teal for anything the household is deciding on.<\u002Fdiv>\n<div><strong style=\"color:#24312E\">Rhythm.<\u002Fstrong> One decision per screen in capture flows; one week per screen in the planner.<\u002Fdiv>\n<div><strong style=\"color:#24312E\">Chips.<\u002Fstrong> Rounded ingredient chips carry state and always pair colour with a word.<\u002Fdiv>\n<div><strong style=\"color:#24312E\">Type.<\u002Fstrong> Outfit for the wordmark and headlines, Figtree for interface and numerals.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#FFF8EC;border:1px solid rgba(36,49,46,.1);border-radius:18px;padding:18px 20px\">\n<div style=\"font:700 12px/1 Figtree;letter-spacing:.08em;text-transform:uppercase;color:#145C52;margin-bottom:12px\">Palette<\u002Fdiv>\n<div style=\"display:flex;gap:7px\">\n<div style=\"flex:1;height:44px;border-radius:9px;background:#145C52\"><\u002Fdiv>\n<div style=\"flex:1;height:44px;border-radius:9px;background:#0C403A\"><\u002Fdiv>\n<div style=\"flex: e;color:#145C52\">2 kg<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:13px 16px;display:flex;justify-content:space-between;border-bottom:1px solid rgba(36,49,46,.07)\"><span style=\"font:500 14px/1 Figtree\">Tomatoes<\u002Fspan><span style=\"font:600 14px/1 Figtree;color:#145C52\">6 ripe<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:13px 16px;display:flex;justify-content:space-between;border-bottom:1px solid rgba(36,49,46,.07)\"><span style=\"font:500 14px/1 Figtree\">Onions<\u002Fspan><span style=\"font:600 14px/1 Figtree;color:#145C52\">3 large<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:13px 16px;display:flex;justify-content:space-between;border-bottom:1px solid rgba(36,49,46,.07)\"><span style=\"font:500 14px/1 Figtree\">Potatoes<\u002Fspan><span style=\"font:600 14px/1 Figtree;color:#145C52\">4<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:13px 16px;display:flex;justify-content:space-between\"><span style=\"font:500 14px/1 Figtree;color:rgba(36,49,46,.6)\">+ 10 more<\u002Fspan><span class=\"ms\" style=\"font-size:19px;color:rgba(36,49,46,.4)\">expand_more<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:14px 22px 44px;border-top:1px solid rgba(36,49,46,.1)\">\n    <button sc-camel-on-click=\"{{ goRecipe }}\" style=\"width:100%;font:700 16px/1 Figtree;background:#145C52;color:#FFF8EC;border:none;border-radius:14px;padding:17px;cursor:pointer\">Save to my recipes<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isRecipe }}\">\n<div style=\"position:absolute;inset:0;background:#FFF8EC;display:flex;flex-direction:column\">\n  <div style=\"height:238px;flex:none;background:linear-gradient(160deg,#145C52,#0C403A);position:relative;display:flex;align-items:flex-end;padding:22px\">\n    <div style=\"position:absolute;top:58px;left:22px;right:22px;display:flex;justify-content:space-between\">\n      <button sc-camel-on-click=\"{{ goRecipeReview }}\" style=\"width:38px;height:38px;border-radi top:4px\">total<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1;background:#fff;border:1px solid rgba(36,49,46,.1);border-radius:14px;padding:13px;text-align:center\"><div style=\"font:700 17px/1 Figtree;color:#145C52\">5<\u002Fdiv><div style=\"font:400 11px/1.3 Figtree;color:rgba(36,49,46,.6);margin-top:4px\">you have<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font:600 12px/1 Figtree;letter-spacing:.06em;text-transform:uppercase;color:#145C52;margin-bottom:10px\">Ingredients<\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid rgba(36,49,46,.1);border-radius:18px;overflow:hidden;margin-bottom:20px\">\n      <div style=\"padding:13px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(36,49,46,.07)\"><span style=\"font:500 14px/1 Figtree;flex:1\">Tomatoes · 6 ripe<\u002Fspan><span style=\"font:700 10px/1 Figtree;background:#D85A45;color:#FFF8EC;padding:6px 9px;border-radius:999px\">Use first<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:13px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(36,49,46,.07)\"><span style=\"font:500 14px/1 Figtree;flex:1\">Onions · 3 large<\u002Fspan><span style=\"font:700 10px/1 Figtree;background:#145C52;color:#FFF8EC;padding:6px 9px;border-radius:999px\">Have<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:13px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(36,49,46,.07)\"><span style=\"font:500 14px/1 Figtree;flex:1\">Potatoes · 4<\u002Fspan><span style=\"font:700 10px/1 Figtree;background:#145C52;color:#FFF8EC;padding:6px 9px;border-radius:999px\">Have<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:13px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(36,49,46,.07)\"><span style=\"font:500 14px/1 Figtree;flex:1\">Lamb knuckles · 2 kg<\u002Fspan><span style=\"font:700 10px/1 Figtree;background:rgba(36,49,46,.1);color:rgba(36,49,46,.6);padding:6px 9px;border-radius:999px\">Still needed<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:13px 16px;display:flex;align-items:center;gap:11px\"><span style=\"font:500 14px/1 Figtree;flex:1;color:rgba(36,49,46,.6)\">+ 10 more<\u002Fspan><span class=\"ms\" style=\"font-size:19px;color:rgba(36,49,46,.4)\">expand_more<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font:600 12px/1 Figtree;letter-spacing:.06em;text-transform:uppercase;color:#145C52;margin-bottom:10px\">Method<\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid rgba(36,49,46,.1);border-radius:18px;padding:18px 20px;font:400 14px/1.6 Figtree;color:rgba(36,49,46,.8)\">\n      <div style=\"display:flex;gap:12px;margin-bottom:14px\"><span style=\"font:700 13px/1.5 Figtree;color:#145C52\">1<\u002Fspan><span>Brown the knuckles in a heavy pot, then set them aside.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;margin-bottom:14px\"><span style=\"font:700 13px/1.5 Figtree;color:#145C52\">2<\u002Fspan><span>Soften the onions, add the tomatoes and let them cook down.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px\"><span style=\"font:700 13px/1.5 Figtree;color:#145C52\">3<\u002Fspan><span>Return the meat, cover and simmer for two hours.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font:400 12px/1.5 Figtree;color:rgba(36,49,46,.5);margin-top:14px\">Photographed from Kook Makietie, p. 84. Kept for your own use.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:14px 22px 44px;border-top:1px solid rgba(36,49,46,.1);display:flex;gap:10px\">\n    <button sc-camel-on-click=\"{{ goAddToPlan }}\" style=\"flex:1;font:700 16px/1 Figtree;background:#145C52;color:#FFF8EC;border:none;border-radius:14px;padding:17px;cursor:pointer\">Add to the plan<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ goCook }}\" style=\"font:600 15px/1 Figtree;background:transparent;border:1px solid rgba(36,49,46,.2);color:#24312E;border-radius:14px;padding:17px 18px;cursor:pointer\">Cook now<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAddToPlan }}\">\n<div style=\"position:absolute;inset:0;background:rgba(27,36,34,.5);display:flex;flex-direction:column;justify-content:flex-end\">\n  <div style=\"background:#FFF8EC;border-radius:26px 26px 0 0;padding:26px 22px 44px;animation:saamlyRise .22s ease\">\n    <div style=\"width:42px;height:4px;border-radius:9px;background:rgba(36,49,46,.18);margin:0 auto 20px\"><\u002Fdiv>\n    <h3 style=\"font:600 22px/1.15 Outfit;margin:0 0 6px\">Which night?<\u002Fh3>\n    <p style=\"font:400 13px/1.45 Figtree;color:rgba(36,49,46,.62);margin:0 0 18px\">It takes 2 hr 10, so we suggest a night with time.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:9px;margin-bottom:18px\">\n      <div style=\"background:#145C52;border-radius:14px;padding:15px 16px;display:flex;justify-content:space-between;align-items:center\">\n        <div><div style=\"font:600 15px/1.2 Figtree;color:#FFF8EC\">Sunday 10 Aug<\u002Fdiv><div style=\"font:400 12px/1.3 Figtree;color:rgba(255,248,236,.7);margin-top:3px\">Replaces lentil bredie · everyone home<\u002Fdiv><\u002Fdiv>\n        <span class=\"ms\" style=\"font-size:22px;color:#F2C14E\">check_circle<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid rgba(36,49,46,.12);border-radius:14px;padding:15px 16px\">\n        <div style=\"font:600 15px/1.2 Figtree\">Saturday 9 Aug<\u002Fdiv><div style=\"font:400 12px/1.3 Figtree;color:rgba(36,49,46,.55);margin-top:3px\">Marco is already cooking chakalaka<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid rgba(36,49,46,.12);border-radius:14px;padding:15px 16px\">\n        <div style=\"font:600 15px/1.2 Figtree\">Next week<\u002Fdiv><div style=\"font:400 12px/1.3 Figtree;color:rgba(36,49,46,.55);margin-top:3px\">Keep it for later<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:rgba(184,208,194,.4);border-radius:14px;padding:14px 16px;display:flex;gap:11px;margin-bottom:18px\">\n      <span class=\"ms\" style=\"font-size:20px;color:#145C52\">shopping_basket<\u002Fspan>\n      <span style=\"font:400 13px/1.45 Figtree;color:rgba(36,49,46,.8)\">Adds lamb knuckles and 3 other things to the shared list. The tomatoes at home get used first.<\u002Fspan>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ confirmAdd }}\" style=\"width:100%;font:700 16px/1 Figtree;background:#145C52;color:#FFF8EC;border:none;border-radius:14px;padding:17px;cursor:pointer;margin-bottom:10px\">Add to Sunday<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ goRecipe }}\" style=\"width:100%;font:600 15px/1 Figtree;background:transparent;color:rgba(36,49,46,.6);border:none;padding:6px;cursor:pointer\">Cancel<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ isSetupChips }}\">\n<div style=\"position:absolute;inset:0;background:#FFF8EC;display:flex;flex-direction:column\">\n  <div style=\"padding:58px 22px 12px\">\n    <button sc-camel-on-click=\"{{ goHome }}\" style=\"background:none;border:none;padding:0 0 12px;cursor:pointer;display:flex\"><span class=\"ms\" style=\"font-size:26px;color:#24312E\">arrow_back<\u002Fspan><\u002Fbutton>\n    <h2 style=\"font:600 25px/1.15 Outfit;margin:0 0 6px;letter-spacing:-.01em\">Tell us about your week<\u002Fh2>\n    <p style=\"font:400 14px/1.45 Figtree;color:rgba(36,49,46,.62);margin:0\">Four taps is enough. We will fill in the rest.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"flex:1;overflow:auto;padding:12px 22px 22px\">\n    <div style=\"font:600 12px/1 Figtree;letter-spacing:.06em;text-transform:uppercase;color:#145C52;margin-bottom:10px\">Who is eating<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px\">\n      <sc-for list=\"{{ members }}\" as=\"m\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ m.toggle }}\" style=\"{{ m.style }}\">{{ m.name }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <button style=\"font:600 11px/1 Figtree;padding:7px 10px;border-radius:999px;cursor:pointer;border:1px dashed rgba(36,49,46,.28);background:transparent;color:#145C52\">+ Guest<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font:600 12px/1 Figtree;letter-spacing:.06em;text-transform:uppercase;color:#145C52;margin-bottom:10px\">Nights that are different<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px\">\n      <sc-for list=\"{{ nights }}\" as=\"n\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{ n.toggle }}\" style=\"{{ n.style }}\">{{ n.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <button style=\"font:600 11px/1 Figtree;padding:7px 10px;border-radius:999px;cursor:pointer;border:1px dashed rgba(36,49,46,.28);background:transparent;color:#145C52\">+ Add a night<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font:600 12px/1 Figtree;letter-spacing:.06em;text-transform:uppercase;color:#145C52;margin-bottom:10px\">How much time<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px\">\n      <sc-for list=\"{{ efforts }}\" as=\"e\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ e.pick }}\" style=\"{{ e.style }}\">{{ e.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font:600 12px/1 Figtree;letter-spacing:.06em;text-transform:uppercase;color:#145C52;margin-bottom:10px\">Anything already fixed<\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid rgba(36,49,46,.1);border-radius:16px;padding:15px 16px;display:flex;align-items:center;gap:12px;margin-bottom:12px\">\n      <div style=\"width:34px;height:34px;border-radius:9px;background:#B8D0C2;color:#0C403A;font:700 13px/34px Figtree;text-align:center\">M<\u002Fdiv>\n      <div style=\"flex:1\"><div style=\"font:600 14px/1.2 Figtree\">Marco cooks Saturday<\u002Fdiv><div style=\"font:400 12px/1.3 Figtree;color:rgba(36,49,46,.55);margin-top:2px\">Chakalaka, pap &amp; wors<\u002Fdiv><\u002Fdiv>\n      <span class=\"ms\" style=\"font-size:20px;color:#145C52\">push_pin<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:rgba(184,208,194,.35);border-radius:14px;padding:14px 16px;display:flex;gap:11px\">\n      <span class=\"ms\" style=\"font-size:20px;color:#145C52\">kitchen<\u002Fspan>\n      <span style=\"font:400 13px/1.45 Figtree;color:rgba(36,49,46,.8)\">We will start from the 8 things in your kitchen, and plan the spinach early.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:14px 22px 44px;border-top:1px solid rgba(36,49,46,.1)\">\n    <button sc-camel-on-click=\"{{ startPlan }}\" style=\"width:100%;font:700 16px/1 Figtree;background:#145C52;color:#FFF8EC;border:none;border-radius:14px;padding:17px;cursor:pointer\">Plan my week<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSetupChat }}\">\n<div style=\"position:absolute;inset:0;background:#FFF8EC;display:flex;flex-direction:column\">\n  <div style=\"padding:58px 22px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(36,49,46,.08)\">\n    <button sc-camel-on-click=\"{{ goHome }}\" style=\"background:none;border:none;padding:0;cursor:pointer;display:flex\"><span class=\"ms\" style=\"font-size:26px;color:#24312E\">arrow_back<\u002Fspan><\u002Fbutton>\n    <div style=\"width:32px;height:32px;border-radius:9px;background:#145C52;color:#FFF8EC;font:600 14px/32px Outfit;text-align:center\">s<\u002Fdiv>\n    <div><div style=\"font:600 14px/1.1 Figtree\">Plan the week<\u002Fdiv><div style=\"font:400 11px/1.2 Figtree;color:rgba(36,49,46,.5);margin-top:2px\">Answer in your own words<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:12px\">\n    <div style=\"max-width:82%;background:#fff;border:1px solid rgba(36,49,46,.1);border-radius:16px 16px 16px 5px;padding:14px 16px;font:400 14px/1.5 Figtree\">Who is eating at home this week?<\u002Fdiv>\n    <div style=\"align-self:flex-end;max-width:82%;background:#145C52;color:#FFF8EC;border-radius:16px 16px 5px 16px;padding:14px 16px;font:400 14px/1.5 Figtree\">All four of us, but Thursday is just me and the kids<\u002Fdiv>\n    <sc-if value=\"{{ chatShow2 }}\">\n      <div style=\"max-width:82%;background:#fff;border:1px solid rgba(36,49,46,.1);border-radius:16px 16px 16px 5px;padding:14px 16px;font:400 14px/1.5 Figtree;animation:saamlyRise .2s ease\">Noted. Which evenings are tight on time?<\u002Fdiv>\n      <div style=\"align-self:flex-end;max-width:82%;background:#145C52;color:#FFF8EC;border-radius:16px 16px 5px 16px;padding:14px 16px;font:400 14px/1.5 Figtree\">Tuesday and Thursday. Friday there is soccer at five<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ chatShow3 }}\">\n      <div style=\"max-width:88%;background:#fff;border:1px solid rgba(36,49,46,.1);border-radius:16px 16px 16px 5px;padding:14px 16px;font:400 14px/1.5 Figtree;animation:saamlyRise .2s ease\">\n        Got it. I will keep Tuesday, Thursday and Friday under 35 minutes, plan the opened spinach early and reuse Monday's curry on Thursday.\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:12px\">\n          <span style=\"font:600 11px/1 Figtree;background:rgba(20,92,82,.1);color:#145C52;padding:7px 10px;border-radius:999px\">4 eating<\u002Fspan>\n          <span style=\"font:600 11px/1 Figtree;background:rgba(20,92,82,.1);color:#145C52;padding:7px 10px;border-radius:999px\">Thu · 3 eating<\u002Fspan>\n          <span style=\"font:600 11px/1 Figtree;background:rgba(216,90,69,.12);color:#D85A45;padding:7px 10px;border-radius:999px\">Spinach first<\u002Fspan>\n          <span style=\"font:600 11px/1 Figtree;background:rgba(20,92,82,.1);color:#145C52;padding:7px 10px;border-radius:999px\">Sat · Marco cooks<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"padding:12px 22px 44px;border-top:1px solid rgba(36,49,46,.08)\">\n    <sc-if value=\"{{ c hold<\u002Fspan><span class=\"ms\" style=\"font-size:19px;color:rgba(36,49,46,.4)\">chevron_right<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font:400 12px/1.5 Figtree;color:rgba(36,49,46,.45)\">Saamly · Plan saam. Eat better.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showTabs }}\">\n<div style=\"position:absolute;bottom:0;left:0;right:0;z-index:65;background:rgba(255,248,236,.94);border-top:1px solid rgba(36,49,46,.1);padding:11px 12px 30px;display:flex\">\n  <button sc-camel-on-click=\"{{ goHome }}\" style=\"flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px\">\n    <span class=\"ms\" style=\"font-size:23px;color:{{ tabHome }}\">calendar_month<\u002Fspan>\n    <span style=\"font:600 10px/1 Figtree;color:{{ tabHome }}\">This week<\u002Fspan>\n  <\u002Fbutton>\n  <button sc-camel-on-click=\"{{ goKitchen }}\" style=\"flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px\">\n    <span class=\"ms\" style=\"font-size:23px;color:{{ tabKitchen }}\">kitchen<\u002Fspan>\n    <span style=\"font:600 10px/1 Figtree;color:{{ tabKitchen }}\">Kitchen<\u002Fspan>\n  <\u002Fbutton>\n  <button sc-camel-on-click=\"{{ goCapture }}\" style=\"flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px\">\n    <span class=\"ms\" style=\"font-size:23px;color:{{ tabRecipes }}\">menu_book<\u002Fspan>\n    <span style=\"font:600 10px/1 Figtree;color:{{ tabRecipes }}\">Recipes<\u002Fspan>\n  <\u002Fbutton>\n  <button sc-camel-on-click=\"{{ goList }}\" style=\"flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px\">\n    <span class=\"ms\" style=\"font-size:23px;color:{{ tabList }}\">shopping_basket<\u002Fspan>\n    <span style=\"font:600 10px/1 Figtree;color:{{ tabList }}\">List<\u002Fspan>\n  <\u002Fbutton>\n  <button sc-camel-on-click=\"{{ goYou }}\" style=\"flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px\">\n    <span class=\"ms\" style=\"font-size:23px;color:{{ tabYou }}\">person<\u002Fspan>\n    <span style=\"font:600 10px/1 Figtree;color:{{ tabYou }}\">You<\u002Fspan>\n  <\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"width:300px;flex:none;display:flex;flex-direction:column;gap:22px\">\n<div style=\"background:#0C403A;border-radius:18px;padding:20px\">\n<div style=\"font:700 12px/1 Figtree;letter-spacing:.08em;text-transform:uppercase;color:#B8D0C2;margin-bottom:14px\">Explore the variants<\u002Fdiv>\n<div style=\"font:600 12px/1 Figtree;color:rgba(255,255,255,.62);margin-bottom:8px\">Planner layout<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:18px\">\n<button sc-camel-on-click=\"{{ layoutDays }}\" style=\"{{ lDays }}\">Day list · one card per meal<\u002Fbutton>\n<button sc-camel-on-click=\"{{ layoutStrip }}\" style=\"{{ lStrip }}\">Week strip + focused day<\u002Fbutton>\n<button sc-camel-on-click=\"{{ layoutThread }}\" style=\"{{ lThread }}\">Ingredient threads across the week<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"font:600 12px/1 Figtree;color:rgba(255,255,255,.62);margin-bottom:8px\">Confirm what we found<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:18px\">\n<button sc-camel-on-click=\"{{ confirmList }}\" style=\"{{ cList }}\">Full list, adjust in place<\u002Fbutton>\n<button sc-camel-on-click=\"{{ confirmTriage }}\" style=\"{{ cTriage }}\">One item at a time<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"font:600 12px/1 Figtree;color:rgba(255,255,255,.62);margin-bottom:8px\">Describe the week<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<button sc-camel-on-click=\"{{ setupChips }}\" style=\"{{ sChips }}\">Tappable chips, no typing<\u002Fbutton>\n<button sc-camel-on-click=\"{{ setupChat }}\" style=\"{{ sChat }}\">Conversational<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#FFF8EC;border:1px solid rgba(36,49,46,.1);border-radius:18px;padding:18px 20px\">\n<div style=\"font:700 12px/1 Figtree;letter-spacing:.08em;text-transform:uppercase;color:#145C52;margin-bottom:12px\">Jump to a screen<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n<sc-for list=\"{{ index }}\" as=\"s\" hint-placeholder-count=\"12\">\n<button sc-camel-on-click=\"{{ s.go }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:1000},&quot;platform&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ios&quot;,&quot;android&quot;],&quot;default&quot;:&quot;ios&quot;,&quot;tsType&quot;:&quot;'ios'|'android'&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;plannerLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;days&quot;,&quot;strip&quot;,&quot;thread&quot;],&quot;default&quot;:&quot;days&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variants&quot;},&quot;confirmStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;list&quot;,&quot;triage&quot;],&quot;default&quot;:&quot;list&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variants&quot;},&quot;setupStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;chips&quot;,&quot;chat&quot;],&quot;default&quot;:&quot;chips&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variants&quot;}}\">\nconst STATUS = {\n  have:      { label: 'Have',          bg: '#145C52', fg: '#FFF8EC' },\n  probably:  { label: 'Probably have', bg: '#F2C14E', fg: '#24312E' },\n  use:       { label: 'Use first',     bg: '#D85A45', fg: '#FFF8EC' },\n  personal:  { label: 'Personal',      bg: '#B8D0C2', fg: '#24312E' },\n  out:       { label: 'Out',           bg: 'rgba(36,49,46,.10)', fg: 'rgba(36,49,46,.6)' }\n};\nconst CYCLE = ['have', 'probably', 'use', 'personal', 'out'];\n\nconst SCAN = [\n  { name: 'Baby spinach',   qty: '1 bag · already opened', def: 'use',      note: 'Opened, so we will plan it early in the week.' },\n  { name: 'Chicken thighs', qty: '1 kg · freezer',         def: 'have',     note: '' },\n  { name: 'Butternut',      qty: '1 whole',                def: 'have',     note: '' },\n  { name: 'Plain yoghurt',  qty: 'amount unclear',         def: 'probably', note: 'We probably saw yoghurt. Check the amount before we leave it off your list.' },\n  { name: 'Feta',           qty: 'part of a tub',          def: 'probably', note: 'Enough for one meal, we think.' },\n  { name: 'Tomatoes',       qty: '4 · ripe',               def: 'use',      note: '' },\n  { name: 'Eggs',           qty: 'about 6',                def: 'probably', note: 'The back of the box was hidden.' },\n  { name: 'Protein yoghurt', qty: \"Marco's\",               def: 'personal', note: 'Marked personal, so shared meals will leave it alone.' }\n];\n\nconst DAYS = [\n  { d: 'Mon', date: '4 Aug', meal: 'Chicken & butternut curry', why: 'Uses the butternut and half the chicken', time: '45 min', who: 'Everyone', tag: 'use' },\n  { d: 'Tue', date: '5 Aug', meal: 'Spinach & feta pasta bake', why: 'Uses the spinach first', time: '35 min', who: 'Everyone', tag: 'use' },\n  { d: 'Wed', date: '6 Aug', meal: 'Bobotie with yellow rice', why: \"Ayanda's favourite, and there is mince in the freezer\", time: '1 hr', who: 'Everyone', tag: '' },\n  { d: 'Thu', date: '7 Aug', meal: 'Curry wraps', why: \"Reuses Monday's curry\", time: '15 min', who: 'Thandi, Ayanda, Lulu', tag: 'reuse' },\n  { d: 'Fri', date: '8 Aug', meal: 'Braai-spiced chicken flatbreads', why: 'Finishes the chicken before soccer practice', time: '25 min', who: 'Everyone', tag: 'reuse' },\n  { d: 'Sat', date: '9 Aug', meal: 'Chakalaka, pap & wors', why: 'Marco is cooking', time: '50 min', who: 'Everyone + Gogo', tag: '' },\n  { d: 'Sun', date: '10 Aug', meal: 'Lentil bredie & roast veg', why: 'Uses the rest of the butternut', time: '1 hr 20', who: 'Everyone + Gogo', tag: 'reuse' }\n];\n\nconst THREADS = [\n  { ing: 'Chicken thighs', colour: '#145C52', days: [0, 4] },\n  { ing: 'Baby spinach',   colour: '#D85A45', days: [1, 3] },\n  { ing: 'Butternut',      colour: '#F2C14E', days: [0, 6] }\n];\n\nconst COOK = [\n  { text: 'Wilt the whole bag of spinach in a dry pan, then squeeze out the water.', a: 'Baby spinach · the whole bag', b: 'Large pan' },\n  { text: 'Boil the pasta two minutes short of the packet time.', a: 'Pasta · 500 g', b: 'Big pot of salted water' },\n  { text: 'Fold the spinach, feta and milk through the pasta and season well.', a: 'Feta · the rest of the tub', b: 'Milk · 200 ml' },\n  { text: 'Bake for 20 minutes until the top is brown, then let it stand.', a: 'Oven at 200°C', b: 'Baking dish' }\n];\n\nconst INDEX = [\n  ['welcome', 'Welcome'], ['household', 'Household'], ['invite', 'Invite'],\n  ['home', 'This week'], ['scan', 'Scan fridge'], ['scanning', 'Reading photo'],\n  ['review', 'Confirm items'], ['kitchen', 'What you have'],\n  ['capture', 'Add a recipe'], ['recipeCam', 'Cookbook photo'], ['recipePaste', 'Paste a link'],\n  ['recipeReview', 'Check recipe'], ['recipe', 'Recipe'], ['addToPlan', 'Add to plan'],\n  ['setup', 'Your week'], ['generating', 'Planning'], ['plan', 'The plan'],\n  ['cook', 'Cook tonight'], ['list', 'Shared list'], ['basket', 'Basket'], ['you', 'You']\n];\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'welcome', platform: null, layout: null, confirm: null, setup: null,\n    inv: {}, triage: 0, checked: {}, cookStep: 0, sheet: null, day: 1,\n    members: { Thandi: true, Marco: true, Ayanda: true, Lulu: true },\n    nights: { 'Thu out': true, 'Sat guests': true },\n    effort: 'Quick on weeknights', store: 'pnp', added: false, chatStep: 0\n  };\n\n  get platform() { return this.state.platform || this.props.platform || 'ios'; }\n  get layout() { return this.state.layout || this.props.plannerLayout || 'days'; }\n  get confirmStyle() { return this.state.confirm || this.props.confirmStyle || 'list'; }\n  get setupStyle() { return this.state.setup || this.props.setupStyle || 'chips'; }\n\n  go = (s) => () => this.setState({ screen: s, sheet: null });\n\n  pill(active, dark) {\n    const base = 'font:600 12px/1 Figtree;padding:9px 11px;border-radius:9px;border:none;cursor:pointer;text-align:left;transition:background .15s,color .15s;';\n    if (dark) return base + (active\n      ? 'background:#11E9B4;background:#B8D0C2;color:#0C403A;'\n      : 'background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);');\n    return base + (active ? 'background:#145C52;color:#FFF8EC;' : 'background:transparent;color:rgba(36,49,46,.7);');\n  }\n\n  chip(active) {\n    return 'font:600 11px/1 Figtree;padding:7px 10px;border-radius:999px;cursor:pointer;border:1px solid ' +\n      (active ? '#145C52;background:#145C52;color:#FFF8EC;' : 'rgba(36,49,46,.16);background:transparent;color:rgba(36,49,46,.7);');\n  }\n\n  status(item) { return this.state.inv[item.name] || item.def; }\n\n  renderVals() {\n    const p = this.platform, L = this.layout, C = this.confirmStyle, S = this.setupStyle, sc = this.state.screen;\n    const items = SCAN.map((it) => {\n      const st = this.status(it);\n      const meta = STATUS[st];\n      return {\n        ...it, statusLabel: meta.label, chipBg: meta.bg, chipFg: meta.fg,\n        isProbably: st === 'probably', isUse: st === 'use', notUse: st !== 'use', hasNote: !!it.note && (st === 'probably' || st === 'use' || st === 'personal'),\n        cycle: () => this.setState(s => ({ inv: { ...s.inv, [it.name]: CYCLE[(CYCLE.indexOf(st) + 1) % CYCLE.length] } }))\n      };\n    });\n    const tItem = items[Math.min(this.state.triage, items.length - 1)];\n    const days = DAYS.map((d, i) => ({\n      ...d, isFocus: i === this.state.day, num: i + 1,\n      tagLabel: d.tag === 'use' ? 'Uses what you have' : d.tag === 'reuse' ? 'Reuses an ingredient' : '',\n      tagBg: d.tag === 'use' ? 'rgba(216,90,69,.12)' : 'rgba(20,92,82,.1)',\n      tagFg: d.tag === 'use' ? '#D85A45' : '#145C52',\n      stripStyle: 'flex:none;width:58px;border:none;cursor:pointer;border-radius:16px;padding:12px 0;text-align:center;' +\n        (i === this.state.day ? 'background:#145C52;color:#FFF8EC;' : 'background:#fff;color:#24312E;box-shadow:inset 0 0 0 1px rgba(36,49,46,.1);'),\n      select: () => this.setState({ day: i })\n    }));\n    const threads = THREADS.map(t => ({\n      ing: t.ing, colour: t.colour,\n      cells: DAYS.map((d, i) => ({\n        on: t.days.includes(i), day: d.d,\n        dot: t.days.includes(i) ? t.colour : 'transparent',\n        line: (i > t.days[0] && i <= t.days[t.days.length - 1]) ? t.colour : 'transparent'\n      }))\n    }));\n    const listItems = [\n      { name: 'Chicken thighs', qty: '1.2 kg', group: 'need', why: 'Monday + Friday' },\n      { name: 'Basmati rice', qty: '2 kg', group: 'need', why: 'Wednesday' },\n      { name: 'Lentils', qty: '500 g', group: 'need', why: 'Sunday' },\n      { name: 'Wraps', qty: '8', group: 'need', why: 'Thursday' },\n      { name: 'Plain yoghurt', qty: 'check the amount', group: 'check', why: 'Wednesday' },\n      { name: 'Eggs', qty: 'about 6 at home', group: 'check', why: 'Wednesday' },\n      { name: 'Baby spinach', qty: '1 bag', group: 'have', why: 'Tuesday' },\n      { name: 'Butternut', qty: '1 whole', group: 'have', why: 'Monday + Sunday' }\n    ].map(it => ({\n      ...it,\n      needs: it.group === 'need', checks: it.group === 'check', has: it.group === 'have',\n      done: !!this.state.checked[it.name],\n      icon: this.state.checked[it.name] ? 'check_circle' : 'radio_button_unchecked',\n      toggle: () => this.setState(s => ({ checked: { ...s.checked
